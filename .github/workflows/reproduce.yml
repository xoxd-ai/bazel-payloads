name: reproduce

# TIN-7477, R581 act eff34be5, design section 3 step 6, critique 2 N2.
#
# The independent reproduction. It runs only on tinyland-nix (the
# GloriousFlywheel ARC pool, the design's second infrastructure), never on a
# GitHub-hosted class: a hosted run shares the fleet, control plane and network
# path of publish.yml's fetch-pack, so it is not independent (PR-P1 review A3).
# If tinyland-nix cannot run it, the fallback is decision D6 for the operator,
# not another runner class. It always does its own fetch, never reads another
# run's artifact, re-packs with main's tools and requires every published file
# to be byte-equal. It posts `bazel-payloads/reproduce` on the PR head (or on
# main for the weekly run), including success for a PR that adds no payload
# file, after main's tree rules pass on it. No other workflow posts it.
#
# Triggers: workflow_dispatch from main with a PR number (payload PRs are
# opened with GITHUB_TOKEN and trigger nothing), and a weekly run on main that
# re-reads npm and nodejs.org on purpose, to catch an unpublish or a serving
# change (C7). Never pull_request: the self-hosted class never runs a PR's
# workflow file or a fork's code. The PR head is fetched as data only.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to reproduce"
        required: true
        type: number
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: reproduce-${{ inputs.pr || 'main' }}
  cancel-in-progress: false

jobs:
  reproduce:
    # N2: `github.event.pull_request` is null on schedule and dispatch, so the
    # guard names the events and the ref; the same-repository check on the PR
    # head is done by tools/reproduce.py against the API.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: tinyland-nix
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Reproduce
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          RUNNER_ENV: ${{ runner.environment }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          [ "$RUNNER_ENV" = self-hosted ] || { echo "reproduce runs on the tinyland-nix ARC class only, never GitHub-hosted"; exit 1; }
          if [ "$EVENT" = schedule ]; then
            target=(--main)
          else
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "bad PR number"; exit 1; }
            target=(--pr "$PR")
          fi
          nix develop -c python3 -I tools/reproduce.py "${target[@]}" --runner-class tinyland-nix --work "$RUNNER_TEMP/reproduce"
